<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14170f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="GZW Companion">
<title>GZW Companion</title>
<style>
:root { --bg:#14170f; --panel:#1e2318; --panel-2:#283020; --border:#3a4430; --text:#e4e6d9; --muted:#9aa08a; --accent:#a3b85c; --accent-dark:#6f7f37; --gold:#e2b93b; --danger:#c0553f; --warn:#d9a441; --radius:10px; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; -webkit-tap-highlight-color: transparent; }
body.is-dragging { user-select: none; -webkit-user-select: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
h2, h3, h4 { margin: 0; }
[hidden] { display: none !important; }
.app { max-width: 900px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(90px + env(safe-area-inset-bottom)); }
.page { padding: 12px; }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 12px 14px; padding-top: calc(12px + env(safe-area-inset-top)); background: var(--panel); border-bottom: 1px solid var(--border); }
.topbar h1 { font-size: 18px; margin: 0; flex: 1; letter-spacing: .5px; text-transform: uppercase; }
.back { font-size: 22px; padding: 0 6px; text-decoration: none; color: var(--text); }
.version { color: var(--muted); font-size: 12px; }
.subtabs { display: flex; overflow-x: auto; background: var(--panel); border-bottom: 1px solid var(--border); }
.subtabs a { flex: 1; white-space: nowrap; padding: 11px 12px; text-align: center; text-decoration: none; color: var(--muted); border-bottom: 3px solid transparent; }
.subtabs a.active { color: var(--text); border-bottom-color: var(--accent); }
.pill { background: var(--gold); color: #000; border-radius: 99px; padding: 0 6px; font-size: 11px; font-weight: 700; }
.home { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 16px; }
.home-card { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px 10px; color: var(--text); text-decoration: none; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); font-weight: 600; }
.home-card.soon { opacity: .55; }
.home-card small { color: var(--muted); font-weight: 400; }
.home-icon { font-size: 34px; }
.footnote { grid-column: 1 / -1; color: var(--muted); font-size: 12px; text-align: center; margin: 16px 0 0; }
.coming-soon { text-align: center; padding: 60px 20px; color: var(--muted); }
.btn { display: inline-block; padding: 9px 14px; background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius); font-weight: 600; text-decoration: none; color: var(--text); }
.btn.primary { background: var(--accent-dark); border-color: var(--accent); }
.btn.danger { border-color: var(--danger); color: #f0a898; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.card { display: block; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; color: var(--text); text-decoration: none; }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 16px 4px 6px; }
.muted-s { color: var(--muted); font-size: 13px; margin: 4px 0; }
.bar { display: block; height: 6px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
.bar.big { height: 10px; margin: 8px 0; }
.bar > span { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.chip { white-space: nowrap; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--border); color: var(--muted); }
.chip.active { background: var(--accent-dark); color: var(--text); border-color: var(--accent); }
.hint { background: var(--panel-2); border-radius: var(--radius); padding: 10px 12px; font-size: 14px; margin: 8px 0; }
.warnbox { border: 1px solid var(--warn); color: #f2d28f; background: rgba(217,164,65,.08); border-radius: 8px; padding: 8px 10px; font-size: 13px; margin: 8px 0; }
.empty { text-align: center; color: var(--muted); padding: 30px; }
select { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
.toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
.toolbar-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toolbar-row.small { font-size: 13px; color: var(--muted); gap: 14px; }
.search { flex: 1; min-width: 160px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); font-size: 16px; }
.check { display: flex; align-items: center; gap: 6px; }
.menu { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; background: var(--panel); border-radius: var(--radius); }
.overall { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.row { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 6px; }
.row.done { border-color: var(--accent-dark); }
.row.done .hn::after { content: " ✅"; }
.row.dragging { border-color: var(--gold); box-shadow: 0 6px 20px rgba(0,0,0,.5); background: var(--panel-2); }
.row-main { display: flex; align-items: center; gap: 8px; padding: 8px; }
.handle { touch-action: none; background: none; border: none; color: var(--muted); font-size: 24px; padding: 6px 4px; cursor: grab; }
.icon-wrap { position: relative; width: 44px; height: 44px; flex-shrink: 0; }
.icon { width: 44px; height: 44px; border-radius: 8px; object-fit: contain; background: var(--panel-2); display: block; }
.icon-wrap .placeholder { display: none; }
.icon-wrap.noimg img { display: none; }
.icon-wrap.noimg .placeholder { display: grid; place-items: center; font-weight: 700; font-size: 14px; color: var(--muted); }
.name { flex: 1; min-width: 0; text-align: left; background: none; border: none; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.name-text { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.need { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
.need .bar { max-width: 180px; }
.tag { margin-left: 6px; font-size: 10px; padding: 1px 6px; border-radius: 99px; background: var(--panel-2); color: var(--gold); vertical-align: middle; font-weight: 600; }
.star { background: none; border: none; font-size: 24px; color: var(--muted); padding: 4px; }
.star.on { color: var(--gold); }
.stepper { display: flex; align-items: center; gap: 4px; }
.step { width: 40px; height: 40px; border-radius: 8px; font-size: 22px; line-height: 1; background: var(--panel-2); border: 1px solid var(--border); touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.step:active { background: var(--accent-dark); }
.count { width: 56px; height: 40px; text-align: center; font-weight: 700; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; font-size: 16px; }
.count.money { width: 96px; }
.details { display: flex; padding: 4px 14px 12px; font-size: 13px; color: var(--muted); flex-direction: column; gap: 6px; }
.details b { color: var(--text); }
.details ul { margin: 4px 0 0; padding-left: 18px; }
.banner { display: flex; gap: 10px; align-items: flex-start; background: var(--panel-2); border: 1px solid var(--accent-dark); border-radius: var(--radius); padding: 10px 12px; font-size: 14px; margin-bottom: 10px; }
.banner div { flex: 1; }
.x { background: none; border: none; color: var(--muted); font-size: 18px; padding: 0 4px; }
.summary-row { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
.stat { background: var(--panel-2); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
.stat b { font-size: 17px; color: var(--text); }
.stat.bad b { color: #f0a898; }
.ready-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.ready-links a { font-size: 13px; padding: 4px 10px; border-radius: 99px; background: rgba(163,184,92,.15); text-decoration: none; }
.pin-line { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); text-decoration: none; color: var(--text); font-size: 14px; }
.room-card .rc-top { display: flex; align-items: center; gap: 10px; }
.room-card .rc-icon { font-size: 26px; }
.room-card .rc-name { flex: 1; font-weight: 700; }
.rc-sub { font-size: 13px; color: var(--muted); }
.cap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.cap { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 8px; display: flex; justify-content: space-between; gap: 6px; font-size: 13px; }
.cap b { color: var(--accent); }
.crumb { display: inline-block; margin: 2px 0 10px; text-decoration: none; font-weight: 600; }
.station-card .sc-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.sc-name { font-weight: 700; }
.sc-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
.station-card.ready, .station-card.craftable { border-color: var(--accent); }
.badge { font-size: 12px; padding: 3px 8px; border-radius: 99px; white-space: nowrap; background: var(--panel-2); }
.badge.ready, .badge.craftable { background: rgba(163,184,92,.2); color: #cfe08f; }
.badge.missing { background: rgba(226,185,59,.15); color: #f2d28f; }
.badge.locked { background: rgba(192,85,63,.18); color: #f0a898; }
.badge.maxed { background: rgba(120,160,220,.15); color: #b8cdf0; }
.badge.needs { background: rgba(190,140,220,.15); color: #d9bdf0; }
.badge.incomplete { background: var(--panel-2); color: var(--muted); }
.dots { display: flex; gap: 4px; margin-top: 6px; }
.dot { width: 22px; height: 6px; border-radius: 99px; background: var(--panel-2); }
.dot.on { background: var(--accent); }
.sd-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.pin.on { border-color: var(--gold); color: var(--gold); }
.req { list-style: none; padding: 0; margin: 8px 0; font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
.ways { font-size: 13px; color: var(--muted); margin: 2px 0 6px 22px; padding-left: 14px; list-style: disc; }
.effects { font-size: 14px; display: flex; flex-direction: column; gap: 3px; margin: 8px 0; }
.over { color: #f0a898; }
.mat-list { margin-top: 6px; }
#build-area { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.build-btn { width: 100%; padding: 14px; font-size: 16px; }
.build-note { font-size: 13px; color: #f2d28f; margin: 0; }
.build-warn { font-size: 13px; color: #f0a898; margin: 0; }
.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.inline select { flex: 1; min-width: 0; padding: 9px; }
details.card summary { cursor: pointer; font-weight: 700; }
.lvl { border-top: 1px solid var(--border); padding: 10px 0; font-size: 13px; }
.lvl.next { border-left: 3px solid var(--accent); padding-left: 8px; }
.lvl-head { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.lvl-req { margin: 4px 0; }
.lvl-meta { color: var(--muted); }
.job { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); }
.job-main { flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 16px; padding: 12px 16px; background: #0b0d08; border: 1px solid var(--accent-dark); border-radius: var(--radius); box-shadow: 0 6px 24px rgba(0,0,0,.6); max-width: calc(100% - 24px); }
.toast button { background: none; border: none; color: var(--accent); font-weight: 700; text-transform: uppercase; }
.modal-backdrop { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.65); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
.modal { width: 100%; max-width: 480px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; max-height: calc(100vh - 32px); overflow-y: auto; }
.modal form, .modal .modal-body { display: flex; flex-direction: column; gap: 12px; }
.modal label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.modal label.check { flex-direction: row; color: var(--text); font-size: 14px; }
.modal input:not([type=checkbox]), .modal textarea, .modal select { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 9px; font-size: 16px; width: 100%; }
.modal-msg { margin: 0; line-height: 1.45; }
.modal-buttons { display: flex; gap: 8px; align-items: center; }
.error { color: #f0a898; margin: -6px 0 0; font-size: 13px; }
.error:empty { display: none; }
.two { display: flex; gap: 8px; }
.two > label { flex: 1; min-width: 0; }
.two > label.narrow { flex: 0 0 90px; }
.ing-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.ing-row .ing-item { flex: 1; min-width: 0; }
.modal .ing-row .ing-qty { width: 64px; flex: 0 0 64px; }
.q-arrows { display: flex; flex-direction: column; gap: 4px; }
.q-arrows .btn { padding: 2px 10px; font-size: 12px; line-height: 1.4; }
.job .btn { white-space: nowrap; }
.station-card .inline { margin-top: 8px; }
@media (max-width: 480px) {
  .row-main { flex-wrap: wrap; }
  .name { flex-basis: calc(100% - 130px); }
  .stepper { width: 100%; justify-content: flex-end; }
  .mat .stepper, .row .stepper { width: 100%; }
  .step { width: 46px; height: 46px; }
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="toast-root"></div>
<div id="modal-root"></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>
<script>
"use strict";
// =============================================================
// GAME DATA – edit this part when a game patch changes things
// =============================================================
const APP_VERSION = "0.1.4";
const SAVE_VERSION = 2;
const STORAGE_KEY = "gzw-companion";
const DATA_SOURCE = "Gray Zone Warfare 0.5 (Rogue Ops) – community data, unconfirmed – Oct 2026";
const slug = (name) => String(name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
const IMG = "https://static.wikia.nocookie.net/gray-zone-warfare/images/";

const CATEGORIES = [
  { id: "building", label: "Building" },
  { id: "production", label: "Production" },
  { id: "crafting", label: "Crafting" },
  { id: "crafted", label: "Crafted" },
  { id: "other", label: "Other" },
];

// [ name, category, { optional: image, info, step, money } ]
const RAW_ITEMS = [
  ["US Dollars", "building", { step: 1000, money: true, info: "Cash cost for Level 2–3 builds" }],
  ["Analog Indicator", "building", { image: IMG + "0/03/Analog_Indicator_inspect.png/revision/latest", info: "1x1 · 0.5 kg · sells $15 · Tool box" }],
  ["Burner Head", "building", { image: IMG + "5/5f/Burner_Head_inspect.png/revision/latest", info: "1x1 · 0.25 kg · sells $15 · Loose loot" }],
  ["Chemicals", "building"],
  ["CNC Drill Bits", "building", { image: IMG + "2/22/CNC_Drill_Bits_inspect.png/revision/latest", info: "1x1 · 0.42 kg · sells $60 · Loose loot" }],
  ["Complex Glass Electrode", "building", { info: "1x2 · 0.45 kg · sells $150 · Loose loot" }],
  ["Construction Material", "building", { image: IMG + "3/38/Icon_Construction_Mat.png/revision/latest", info: "3x3 · 10 kg · sells $15 · Building Materials Crate, loose loot" }],
  ["Copper", "building", { image: IMG + "d/db/Icon_Copper.png/revision/latest", info: "3x3 · 3 kg · sells $30 · Loose loot" }],
  ["Crystal Prism", "building", { image: IMG + "7/7a/Crystal_Prism_inspect.png/revision/latest", info: "1x1 · 0.035 kg · sells $150 · Loose loot" }],
  ["Dynamo", "building", { info: "2x2 · 3 kg · sells $150 · Loose loot" }],
  ["Fabrics", "building"], ["Fine Metal Mesh", "building"], ["Glass", "building"], ["Graphics Card", "building"],
  ["HEPA Filter", "building"], ["Laboratory Flask", "building"], ["Laser Tube", "building"], ["Mechanical Parts", "building"],
  ["Mechanical Pipette", "building"], ["Microscope", "building"], ["Motherboard", "building"],
  ["Motor Oil", "building", { info: "2x2 · 4.3 kg · sells $15 · Existed before 0.5" }],
  ["Multimeter", "building"], ["Oscilloscope", "building"], ["PC Fan", "building"], ["Plastics", "building"],
  ["Plumbing Parts", "building"], ["Power Supply", "building"], ["RAM", "building"], ["Refrigerant", "building"],
  ["Server CPU", "building"], ["Signal Generator", "building"], ["Silicone Sealant", "building"], ["Soldering Iron", "building"],
  ["Stainless Steel Sheet", "building"],
  ["Steel", "building", { info: "4x2 · 4.4 kg · sells $30 · Building Materials Crate, loose loot" }],
  ["Tool Set", "building", { info: "2x2 · 1 kg · sells $142 · Existed before 0.5" }],
  ["Tooling Coolant", "building"], ["Vapor Lamp", "building"], ["Water Pump", "building"], ["Wood", "building"], ["Zinc Electrode", "building"],
  // Production (Laboratory)
  ["Ammonium Chloride", "production"], ["Garden Lime", "production"],
  ["Opium Gum", "production", { info: "2x2 · 2 kg · sells $150 · Loose loot" }],
  ["Purified Water", "production"],
  // Crafting materials
  ["Circuit Board", "crafting"], ["Civilian Software", "crafting"], ["Military Software", "crafting"], ["CPU", "crafting"],
  ["CPU Card", "crafting", { info: "Disassemble: Artillery Ballistic Computer (unconfirmed)" }],
  ["Electrical Parts", "crafting"],
  ["Avionics Processor Board", "crafting", { info: "Disassemble: Baget-53-31 Onboard Computer" }],
  ["Digital Synthesis Engine", "crafting", { info: "Disassemble: Counter IED/Jammer Unit" }],
  ["FPGA Module", "crafting", { info: "Disassemble: Manpack Tactical Radio" }],
  ["High-Speed Digital Processor Board", "crafting", { info: "Disassemble: Radar Signal Processor" }],
  ["Multi-Bus Converter", "crafting", { info: "Disassemble: UNLRA Field Terminal" }],
  ["Oven-Controlled Crystal Oscillator", "crafting", { info: "Disassemble: Portable SATCOM Terminal" }],
  ["Server RAM Module", "crafting", { info: "Disassemble: ST1122 Storage Computer" }],
  ["Spoofing ASIC Module", "crafting", { info: "Disassemble: IMSI Catcher" }],
  ["Bone Density Stimulant", "crafting"], ["Empty Auto Injector", "crafting"], ["Glucose", "crafting"],
  ["Human Growth Hormone", "crafting"], ["Iron Sucrose", "crafting"], ["Saline", "crafting"], ["Theophylline", "crafting"],
  ["Vitamin B12", "crafting"], ["Methylene Blue", "crafting"], ["Aniline", "crafting"], ["Bromopyridine", "crafting"],
  ["Methanol", "crafting"], ["High-Quality Morphine Base", "crafting"],
  // Crafted / products (what the Craft button makes)
  ["Basic Hacking Tool", "crafted", { info: "Tier 1 · opens Level 1 keypad doors · 20 s hack" }],
  ["Advanced Hacking Tool", "crafted", { info: "Tier 2 · opens Level 2 keypad doors · 15 s hack" }],
  ["Superior Hacking Tool", "crafted", { info: "Tier 3 · opens all keypad doors · 10 s hack" }],
  ["Tracking Tag", "crafted", { info: "No longer sold by vendors in 0.5" }],
  ["Methylphenidate", "crafted", { info: "Stim · removed from vendors in 0.5" }],
  ["EPO", "crafted", { info: "Stim · removed from vendors in 0.5" }],
  ["ORI-12", "crafted", { info: "Stim · removed from vendors in 0.5" }],
  ["HpR 3-S", "crafted", { info: "Stim · removed from vendors in 0.5" }],
];
const BUILT_IN_ITEMS = RAW_ITEMS.map(([name, category, extra = {}]) => ({ id: slug(name), name, category, step: 1, image: "", info: "", ...extra }));
const BUILT_IN_BY_ID = Object.fromEntries(BUILT_IN_ITEMS.map((i) => [i.id, i]));

// ---------------- ROOMS, CAPABILITIES ----------------
const ROOMS = [
  { id: "utility", name: "Utility Room", icon: "⚡" },
  { id: "laboratory", name: "Laboratory", icon: "🧪" },
  { id: "workshop", name: "Electronics Workshop", icon: "🔧" },
];
const ROOM_BY_ID = Object.fromEntries(ROOMS.map((r) => [r.id, r]));
const CAPS = [
  { id: "heat", name: "Heat Control" },
  { id: "extraction", name: "Extraction & Reaction" },
  { id: "filtration", name: "Filtration & Processing" },
  { id: "analysis", name: "Analysis & Precision" },
  { id: "safety", name: "Safety" },
  { id: "storage", name: "Storage Capacity" },
  { id: "compute", name: "Compute Capacity" },
  { id: "electronics", name: "Electronics" },
  { id: "mech", name: "Mech. Engineering" },
  { id: "rf", name: "Sensor & RF" },
];
const CAP_BY_ID = Object.fromEntries(CAPS.map((c) => [c.id, c]));

// ---------------- STATIONS ----------------
// L(levelName, materials, { gives, needs, power (kW used), produces (kW made), warn })
const L = (name, req, o = {}) => ({ name, req, gives: o.gives || {}, needs: o.needs || {}, power: o.power || 0, produces: o.produces || 0, warn: o.warn || "" });

const RAW_STATIONS = [
  ["generator", "Generator", "utility", [
    L("Two-Stroke Engine", { Steel: 1, "Mechanical Parts": 1, "Motor Oil": 1, Dynamo: 1 }, { produces: 9 }),
    L("Diesel Generator", { Steel: 2, "Mechanical Parts": 2, "Electrical Parts": 2, "Plumbing Parts": 2, "Motor Oil": 1, Dynamo: 1 }, { produces: 18, warn: "Fandom lists 1 Plumbing Parts and 1 Electrical Parts (not 2 each)." }),
  ]],

// Typo-friendly search: "stl" and "steal" both find Steel
function lev(a, b) {
  const d = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = d[j];
      d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = tmp;
    }
  }
  return d[b.length];
}
function fuzzy(query, name) {
  const q = String(query).toLowerCase().trim();
  if (!q) return true;
  const n = String(name).toLowerCase();
  if (n.includes(q)) return true;
  const qn = q.replace(/[^a-z0-9]/g, ""), nn = n.replace(/[^a-z0-9]/g, "");
  if (!qn) return true;
  if (nn.includes(qn)) return true;
  const words = n.split(/[^a-z0-9]+/).filter(Boolean);
  if (qn.length >= 2 && words.some((w) => w[0] === qn[0])) {
    let i = 0;
    for (const c of nn) if (c === qn[i]) i++;
    if (i === qn.length && qn.length <= 4) return true;
  }
  if (qn.length >= 3) {
    const max = qn.length >= 6 ? 2 : 1;
    if (words.some((w) => lev(qn, w.slice(0, qn.length)) <= max || lev(qn, w) <= max)) return true;
  }
  return false;
}

  for (const r of allRecipes()) {
    const okBefore = recipeHardOk(r, state.stationLevels, before), okAfter = recipeHardOk(r, levelsAfter, after);
    if (!okBefore && okAfter) out.push({ label: "Craft: " + r.name, href: "#/hideout/recipe/" + encodeURIComponent(r.id) });
  }
  return out;
}
function recipeHardOk(r, levels, caps) {
  const stOk = !r.station || (levels[r.station.id] || 0) >= r.station.level;
  const capOk = !r.cap || (caps[r.cap.id] || 0) >= r.cap.min;
  return stOk && capOk;
}

function recipeInfo(r, n = 1) {
  const caps = capabilities(), pw = power(), flags = state.recipeFlags[r.id] || {};
  const stCur = r.station ? lvl(r.station.id) : 0;
  const stationOk = !r.station || stCur >= r.station.level;
  const capOk = !r.cap || (caps[r.cap.id] || 0) >= r.cap.min;
  const foundOk = !r.needsRecipe || !!flags.found;
  const taskOk = !r.task || !!flags.task;
  const missing = r.ingredients.filter((x) => have(x.item) < x.qty * n);
  const spare = pw.made - pw.used;
  const powerOver = r.power > 0 && r.power > spare;
  const incomplete = !r.ingredients.length || !r.output;
  const status = incomplete ? "incomplete" : !stationOk || !capOk ? "locked" : !foundOk || !taskOk ? "needs" : missing.length ? "missing" : "craftable";
  return { status, stCur, stationOk, capOk, capHave: r.cap ? caps[r.cap.id] || 0 : 0, foundOk, taskOk, missing, spare, powerOver, incomplete, flags };
}

// How many of each item you still need.
// mode "next" = next level of every station · "max" = everything to max · "pinned" = next level of pinned stations
// Pinned recipes (× amount) are always added on top.
function computeNeeds(mode, opts = {}) {
  const needs = {};
  const add = (id, q) => (needs[id] = (needs[id] || 0) + q);
  for (const st of STATIONS) {
    const cur = lvl(st.id);
    let rem = [];
    if (mode === "max") rem = st.levels.slice(cur);
    else if (mode === "next") rem = st.levels.slice(cur, cur + 1);
    else if (mode === "pinned" && state.pins.includes(st.id)) rem = st.levels.slice(cur, cur + 1);
    for (const lv of rem) for (const [id, q] of Object.entries(lv.req)) add(id, q);
  }
  if (!opts.noRecipes) {
    for (const [rid, times] of Object.entries(state.recipePins)) {
      const r = getRecipe(rid); if (!r) continue;
      for (const x of r.ingredients) add(x.item, x.qty * times);
    }
  }
  return needs;
}

function usedIn(itemId) {
  const stations = [], recipes = [], madeBy = [];
  for (const st of STATIONS) st.levels.forEach((lv, i) => {
    if (lv.req[itemId]) stations.push({ st, level: i + 1, name: lv.name, qty: lv.req[itemId], built: lvl(st.id) > i });
  });
  for (const r of allRecipes()) {
    const x = r.ingredients.find((g) => g.item === itemId);
    if (x) recipes.push({ r, qty: x.qty, unsure: x.unsure });
    if (r.output && r.output.item === itemId) madeBy.push(r);
  }
  return { stations, recipes, madeBy };
}

function invVisible() {
  const p = state.prefs, needs = computeNeeds(p.needMode), favs = new Set(state.favorites);
  const idx = new Map(state.order.map((id, i) => [id, i]));
  const catIdx = new Map(CATEGORIES.map((c, i) => [c.id, i]));
  let list = allItems().filter((it) => {
    if (p.category === "favorites" && !favs.has(it.id)) return false;
    if (p.category === "custom" && !it.custom) return false;
    if (!["all", "favorites", "custom"].includes(p.category) && it.category !== p.category) return false;
    if (ui.invQuery && !fuzzy(ui.invQuery, it.name)) return false;
    if (p.neededOnly && !((needs[it.id] || 0) > have(it.id))) return false;
    return true;
  });
  const byOrder = (a, b) => (idx.get(a.id) ?? 1e9) - (idx.get(b.id) ?? 1e9);
  const sorters = {
    custom: byOrder,
    az: (a, b) => a.name.localeCompare(b.name),
    needed: (a, b) => (Math.max(0, (needs[b.id] || 0) - have(b.id)) - Math.max(0, (needs[a.id] || 0) - have(a.id))) || byOrder(a, b),
    category: (a, b) => (catIdx.get(a.category) - catIdx.get(b.category)) || byOrder(a, b),

  list.sort(sorters[p.sort] || byOrder);

}

    if (n.produces) h += `<span>⚡ Produces ${n.produces} kW (now ${pw.made} kW)</span>`;
    if (i.delta > 0) h += `<span class="${i.powerOver ? "over" : ""}">⚡ Uses ${n.power} kW · after build: ${i.after} / ${i.made} kW${i.powerOver ? " – over the limit" : ""}</span>`;
    else if (!n.produces) h += `<span>⚡ Power: ${n.power ? n.power + " kW" : "none recorded"}</span>`;
    const un = unlocksOf(st);
    if (un.length) h += `<span>🔓 Unlocks: ${un.map((u) => `<a href="${u.href}">${esc(u.label)}</a>`).join(", ")}</span>`;
    h += `</div>`;
    if (n.warn) h += `<div class="warnbox">⚠️ Sources disagree: ${esc(n.warn)} Check in-game.</div>`;
    h += `<div class="mat-list">${Object.entries(n.req).map(([iid, q]) => matRow(iid, q)).join("")}</div>
    <div id="build-area">
      <button class="btn primary build-btn" data-act="build" data-id="${st.id}" ${i.missing.length ? "disabled" : ""}>🔨 Build ${esc(n.name)}</button>
      ${i.missing.length ? `<p class="build-note">Missing: ${i.missing.map((m) => `${esc(itemName(m.id))} (${fmtAmt(m.id, m.have)}/${fmtAmt(m.id, m.need)})`).join(", ")}. Already built it in-game? Use Set level below.</p>` : ""}
      ${!i.missing.length && i.unmet.length ? `<p class="build-warn">🔒 Requirement not met – you can still build, since the data is unconfirmed.</p>` : ""}
      ${!i.missing.length && i.powerOver ? `<p class="build-warn">⚡ This would go over your power limit.</p>` : ""}
    </div></div>`;
  }
  h += `<div class="card"><h3>Set level (no cost)</h3><p class="muted-s">For first setup, if you already built this in-game. Inventory is not changed.</p>
    <div class="inline"><select id="set-level">${[0, ...st.levels.map((_, n) => n + 1)].map((n) => `<option value="${n}" ${n === i.cur ? "selected" : ""}>Level ${n}${n ? " – " + esc(st.levels[n - 1].name) : " (not built)"}</option>`).join("")}</select>
    <button class="btn" data-act="set-level" data-id="${st.id}">Apply</button></div></div>`;
  const rs = allRecipes().filter((r) => r.station && r.station.id === st.id);
  if (rs.length) h += `<div class="card"><h3>🛠 Crafting unlocked here</h3>${rs.map((r) => `<div class="lvl">${ok(i.cur >= r.station.level)} <a href="#/hideout/recipe/${encodeURIComponent(r.id)}">${esc(r.name)}</a> – needs Level ${r.station.level}${r.stationGuess ? " (guess)" : ""}</div>`).join("")}</div>`;
  h += `<details class="card"><summary>All levels (${st.levels.map((_, n) => n + 1).join(" · ")})</summary>
    ${st.levels.map((lv, n) => `<div class="lvl ${n === i.cur ? "next" : ""}"><div class="lvl-head"><b>L${n + 1} – ${esc(lv.name)}</b><span>${n < i.cur ? "✅ Built" : n === i.cur ? "Next" : ""}</span></div>
      <div class="lvl-req">${Object.entries(lv.req).map(([iid, q]) => `${esc(itemName(iid))} ×${fmtAmt(iid, q)}`).join(" · ")}</div>
      <div class="lvl-meta">Gives: ${givesText(lv.gives)}${Object.keys(lv.needs).length ? " · Needs: " + Object.entries(lv.needs).map(([k, v]) => `${esc(capName(k))} ≥ ${v}`).join(", ") : ""}${lv.power ? ` · ⚡${lv.power} kW` : ""}${lv.produces ? ` · Makes ${lv.produces} kW` : ""}${lv.warn ? " · ⚠️ " + esc(lv.warn) : ""}</div></div>`).join("")}
  </details>`;
  return h;
}

// ---------------- CRAFTING ----------------
function recipeTags(r) {
  return (r.custom ? '<span class="tag">Custom</span>' : "") + (r.edited ? '<span class="tag">Edited</span>' : "") +
    (state.recipePins[r.id] ? `<span class="tag">📌×${state.recipePins[r.id]}</span>` : "");
}
function jobsCard(filterRecipe) {
  const jobs = state.jobs.filter((j) => !filterRecipe || j.recipeId === filterRecipe).sort((a, b) => a.end - b.end);
  if (!jobs.length) return "";
  const now = Date.now();
  return `<div class="card"><h3>⏱ Active crafts</h3>${jobs.map((j) => `<div class="job">
    <div class="job-main"><b>${esc(j.name)} ×${j.output.qty}</b><span class="muted-s">${esc(ROOM_BY_ID[j.room] ? ROOM_BY_ID[j.room].name : "")} · <span data-end="${j.end}">${fmtDur(j.end - now)}</span></span>
      ${bar(Math.min(now, j.end) - j.start, j.end - j.start)}</div>
    <button class="btn primary" data-act="collect" data-id="${esc(j.id)}" data-collect="${j.end}" ${j.end > now ? "disabled" : ""}>Collect</button>
    <button class="btn" data-act="cancel-job" data-id="${esc(j.id)}" aria-label="Cancel">✕</button></div>`).join("")}</div>`;
}
function recipeVisible() {
  const p = state.prefs;
  return allRecipes().map((r) => ({ r, i: recipeInfo(r) })).filter(({ r, i }) => {
    if (p.craftRoom === "custom" && !r.custom && !r.edited) return false;
    if (p.craftRoom === "pinned" && !state.recipePins[r.id]) return false;
    if (ROOM_BY_ID[p.craftRoom] && r.room !== p.craftRoom) return false;
    if (p.craftStatus !== "all" && i.status !== p.craftStatus) return false;
    if (ui.craftQuery && !fuzzy(ui.craftQuery, r.name) && !(r.output && fuzzy(ui.craftQuery, itemName(r.output.item)))) return false;
    return true;
  });
}
function recipeCard(r, i) {
  const blockers = [];
  if (r.station && !i.stationOk) blockers.push(`❌ ${esc(STATION_BY_ID[r.station.id].name)} L${r.station.level}`);
  if (r.cap && !i.capOk) blockers.push(`❌ ${esc(capName(r.cap.id))} ≥ ${r.cap.min}`);
  if (!i.foundOk) blockers.push("❌ Recipe not found");
  if (!i.taskOk) blockers.push("❌ Task: " + esc(r.task));
  const haveN = r.ingredients.filter((x) => have(x.item) >= x.qty).length;
  return `<a class="card station-card ${i.status}" href="#/hideout/recipe/${encodeURIComponent(r.id)}">
    <div class="sc-top"><span class="sc-name">${esc(r.name)}${recipeTags(r)}</span><span class="badge ${i.status}">${STATUS[i.status]}</span></div>
    <div class="sc-sub">${ROOM_BY_ID[r.room].icon} ${esc(ROOM_BY_ID[r.room].name)}${r.output ? ` · makes ${esc(itemName(r.output.item))} ×${r.output.qty}` : ""}${r.time ? " · ⏱ " + fmtMinutes(r.time) : ""}</div>
    <div class="sc-sub">${r.ingredients.length ? `Ingredients: ${haveN} / ${r.ingredients.length} ready` : "Ingredients unknown – tap Edit to add"}</div>
    ${blockers.length ? `<div class="sc-sub">${blockers.join(" · ")}</div>` : ""}</a>`;
}
function renderCraftList() {
  const list = recipeVisible();
  if (!list.length) return `<div class="empty">No recipes match.</div>`;
  return list.map(({ r, i }) => recipeCard(r, i)).join("");
}
function renderCrafting() {
  const p = state.prefs, all = allRecipes().map((r) => recipeInfo(r));
  const counts = (s) => all.filter((i) => i.status === s).length;
  return `${!p.hideCraftNote ? `<div class="banner"><div>📝 <b>Most recipe data isn't published yet.</b> Recipes are items you find in the world, and some come from Artisan tasks. Hacking tool ingredients are confirmed; amounts, station levels and times are guesses. Use <b>Edit</b> to fix a recipe – your fix is kept even when the app's data updates.</div><button class="x" data-act="hide-craft-note" aria-label="Hide">✕</button></div>` : ""}
  ${jobsCard()}
  <div class="toolbar">
    <div class="toolbar-row"><input class="search" id="craft-search" data-input="craft-search" type="search" placeholder="🔍 Search recipes..." value="${esc(ui.craftQuery)}">
      <button class="btn primary" data-act="add-recipe">＋ Add recipe</button></div>
    <div class="chips">${[["all", "All"], ["workshop", "🔧 Workshop"], ["laboratory", "🧪 Lab"], ["pinned", "📌 Pinned"], ["custom", "Custom / edited"]].map(([v, l]) => chip("craft-room", v, p.craftRoom, l)).join("")}</div>
    <div class="chips">${[["all", "Any status"], ["craftable", `🟢 Craftable (${counts("craftable")})`], ["missing", `🟡 Missing (${counts("missing")})`], ["needs", `📜 Needs recipe/task (${counts("needs")})`], ["locked", `🔒 Locked (${counts("locked")})`], ["incomplete", `❔ Data missing (${counts("incomplete")})`]].map(([v, l]) => chip("craft-status", v, p.craftStatus, l)).join("")}</div>
  </div>
  <div id="craft-list">${renderCraftList()}</div>`;
}
function renderRecipe(id) {
  const r = getRecipe(id);
  if (!r) return `<div class="empty">Recipe not found. <a href="#/hideout/crafting">Back to crafting</a></div>`;
  const n = ui.craftN[r.id] || 1, i = recipeInfo(r, n), room = ROOM_BY_ID[r.room];
  const pinQ = state.recipePins[r.id] || 0;
  const st = r.station ? STATION_BY_ID[r.station.id] : null;
  let h = `<a class="crumb" href="#/hideout/crafting">← Crafting</a>
  <div class="card"><div class="sd-head"><div><h2>${esc(r.name)}${recipeTags(r)}</h2><div class="muted-s">${room.icon} ${esc(room.name)}${r.output ? ` · makes ${esc(itemName(r.output.item))} ×${r.output.qty}` : ""}</div></div>
    <span class="badge ${i.status}">${STATUS[i.status]}</span></div>
    <div class="inline">
      <button class="btn pin ${pinQ ? "on" : ""}" data-act="pin-recipe" data-id="${esc(r.id)}">📌 ${pinQ ? "Pinned" : "Pin to shopping list"}</button>
      ${pinQ ? `<span class="stepper"><button class="btn" data-act="pin-qty" data-id="${esc(r.id)}" data-d="-1">−</button><b>×${pinQ}</b><button class="btn" data-act="pin-qty" data-id="${esc(r.id)}" data-d="1">+</button></span>` : ""}
    </div>
    <h3 style="margin-top:12px">Requirements</h3><ul class="req">
      ${st ? `<li>${ok(i.stationOk)} <a href="#/hideout/station/${st.id}">${esc(st.name)}</a> Level ≥ ${r.station.level} (you: ${i.stCur})${r.stationGuess ? ' <span class="tag">guess</span>' : ""}</li>` : `<li>❔ Station requirement unknown</li>`}
      ${r.cap ? `<li>${ok(i.capOk)} ${esc(capName(r.cap.id))} ≥ ${r.cap.min} (you: ${i.capHave})${i.capOk ? "" : `<ul class="ways">${waysToRaise(r.cap.id).map((w) => `<li><a href="#/hideout/station/${w.st.id}">${esc(w.st.name)} L${w.level}</a> (+${w.gives})</li>`).join("")}</ul>`}</li>` : ""}
      ${r.needsRecipe ? `<li><label class="check"><input type="checkbox" data-change="flag" data-id="${esc(r.id)}" data-flag="found" ${i.flags.found ? "checked" : ""}> 📜 I've found / learned this recipe</label></li>` : ""}
      ${r.task ? `<li><label class="check"><input type="checkbox" data-change="flag" data-id="${esc(r.id)}" data-flag="task" ${i.flags.task ? "checked" : ""}> 🎯 Task done: ${esc(r.task)}</label></li>` : ""}
      <li>⚡ Power: ${r.power ? `${r.power} kW (spare: ${i.spare} kW)${i.powerOver ? ' <span class="over">– not enough</span>' : ""}` : "none recorded"}</li>
      <li>⏱ Craft time: ${r.time ? fmtMinutes(r.time) + (n > 1 ? ` × ${n} = ${fmtMinutes(r.time * n)}` : "") : "unknown (crafts instantly in the app)"}</li>
    </ul>`;
  if (!r.ingredients.length) {
    h += `<p class="hint">❔ Ingredients for this recipe haven't been published yet. Tap <b>Edit recipe</b> to add them when you see them in-game.</p>`;
  } else {
    h += `<div class="summary-row" style="margin-top:10px"><h3>Ingredients</h3><span class="stepper">Craft <button class="btn" data-act="craft-n" data-id="${esc(r.id)}" data-d="-1">−</button><b>×${n}</b><button class="btn" data-act="craft-n" data-id="${esc(r.id)}" data-d="1">+</button></span></div>
    <div class="mat-list">${r.ingredients.map((x) => {
      const makers = usedIn(x.item).madeBy.filter((m) => m.id !== r.id);
      const extra = (x.unsure ? `<span class="muted-s">×${x.qty}? amount unconfirmed</span>` : "") +
        (makers.length ? `<span class="muted-s">🔗 Craft first: ${makers.map((m) => `<a href="#/hideout/recipe/${encodeURIComponent(m.id)}">${esc(m.name)}</a>`).join(", ")}</span>` : "");
      return matRow(x.item, x.qty * n, extra);
    }).join("")}</div>`;

  if (r.output) h += `<h3 style="margin-top:10px">Makes</h3><div class="mat-list">${matRow(r.output.item, 0, `<span class="muted-s">+${r.output.qty * n} when crafted</span>`)}</div>`;
  const blockedHard = i.incomplete || !i.stationOk || !i.capOk || i.missing.length > 0;
  h += `<div id="build-area"><button class="btn primary build-btn" data-act="craft" data-id="${esc(r.id)}" ${blockedHard ? "disabled" : ""}>🛠 Craft${n > 1 ? " ×" + n : ""}</button>

  </div></div>`;
  h += jobsCard(r.id);
  h += `<div class="card">${r.notes ? `<p class="modal-msg">${esc(r.notes)}</p>` : ""}${r.source ? `<p class="muted-s">Source: ${esc(r.source)}</p>` : ""}
    <div class="inline"><button class="btn" data-act="edit-recipe" data-id="${esc(r.id)}">✏️ Edit recipe</button>
    ${r.edited ? `<button class="btn" data-act="reset-recipe" data-id="${esc(r.id)}">↩️ Reset to default</button>` : ""}
    ${r.custom ? `<button class="btn danger" data-act="delete-recipe" data-id="${esc(r.id)}">🗑 Delete</button>` : ""}</div></div>`;
  return h;
}

function render() {
  const [main, sub, a] = route();
  let title = "GZW Companion", back = "", body = "";
  if (!main) body = renderHome();
  else if (main === "hideout") {
    title = "Hideout"; back = "#/";
    const tab = sub || "inventory";
    const active = tab === "station" ? "rooms" : tab === "recipe" ? "crafting" : tab;
    let inner;
    if (tab === "inventory") inner = renderInventory();
    else if (tab === "rooms") { inner = a ? renderRoom(a) : renderRoomsOverview(); if (a) back = "#/hideout/rooms"; }
    else if (tab === "station") { inner = renderStation(a); back = STATION_BY_ID[a] ? "#/hideout/rooms/" + STATION_BY_ID[a].room : "#/hideout/rooms"; }
    else if (tab === "crafting") inner = renderCrafting();
    else if (tab === "recipe") { inner = renderRecipe(a); back = "#/hideout/crafting"; }
    else inner = comingSoon((HIDEOUT_TABS.find((t) => t.id === tab) || { label: "Not found" }).label);
    body = renderSubtabs(active) + `<main class="page">${inner}</main>`;
  } else {
    const t = MAIN_TABS.find((x) => x.id === main);
    title = t ? t.label : "Not found"; back = "#/";
    body = `<main class="page">${comingSoon(title)}</main>`;
  }
  document.getElementById("app").innerHTML = `<header class="topbar">${back ? `<a class="back" href="${back}" aria-label="Back">←</a>` : ""}<h1>${esc(title)}</h1><span class="version">v${APP_VERSION}</span></header>${body}`;
}
function commit() { saveState(); render(); }
const snapshot = () => JSON.stringify(state);

const toast = { timer: null, snap: null, key: null, amount: 0 };
function showToast(msg, snap, key) {
  toast.snap = snap || null; toast.key = key || null;
  document.getElementById("toast-root").innerHTML = `<div class="toast"><span>${esc(msg)}</span>${snap ? '<button data-act="undo">Undo</button>' : ""}</div>`;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(hideToast, 5000);
}
function hideToast() { document.getElementById("toast-root").innerHTML = ""; toast.snap = null; toast.key = null; }

let modalOk = null;
function openModal(html) {
  document.getElementById("modal-root").innerHTML = `<div class="modal-backdrop" data-act="backdrop"><div class="modal" role="dialog">${html}</div></div>`;
  const f = document.querySelector("#modal-root input:not([type=checkbox]), #modal-root textarea");
  if (f && f.focus && !("ontouchstart" in window)) f.focus();
}
function closeModal() { document.getElementById("modal-root").innerHTML = ""; modalOk = null; }
function confirmBox(title, msgHtml, okLabel, fn, danger) {
  modalOk = fn;
  openModal(`<div class="modal-body"><h3>${esc(title)}</h3><p class="modal-msg">${msgHtml}</p>
    <div class="modal-buttons"><button class="btn ${danger ? "danger" : "primary"}" data-act="modal-ok">${esc(okLabel)}</button><button class="btn" data-act="modal-close">Cancel</button></div></div>`);
}

// =============================================================
// ACTIONS
// =============================================================
function changeCount(id, delta) {
  const cur = have(id), next = Math.max(0, cur + delta);
  if (next === cur) return;
  const key = "count:" + id;
  const snap = toast.key === key && toast.snap ? toast.snap : snapshot();
  if (toast.key !== key || !toast.snap) toast.amount = 0;
  toast.amount += next - cur;
  setCountRaw(id, next);
  commit();
  showToast(`${itemName(id)} ${toast.amount >= 0 ? "+" : "−"}${fmtAmt(id, Math.abs(toast.amount))}`, snap, key);
}
function applyOrder(visibleIds) {
  const order = [...state.order];
  const pos = visibleIds.map((id) => order.indexOf(id)).filter((p) => p >= 0).sort((a, b) => a - b);
  pos.forEach((p, i) => (order[p] = visibleIds[i]));
  state.order = order;
}
function doBuild(st) {
  const i = stationInfo(st); if (i.status === "maxed" || i.missing.length) return;
  const snap = snapshot();
  for (const [id, q] of Object.entries(i.next.req)) setCountRaw(id, have(id) - q);
  state.stationLevels[st.id] = i.cur + 1;
  commit();
  showToast(`🔨 Built ${i.next.name} (L${i.cur + 1})`, snap, "build");
}
function doCraft(r, n) {
  const i = recipeInfo(r, n);
  if (i.incomplete || !i.stationOk || !i.capOk || i.missing.length) return;
  const snap = snapshot();
  const used = r.ingredients.map((x) => ({ item: x.item, qty: x.qty * n }));
  for (const x of used) setCountRaw(x.item, have(x.item) - x.qty);
  const qty = r.output.qty * n;
  if (r.time > 0) {
    const now = Date.now();
    state.jobs.push({ id: uid(), recipeId: r.id, name: r.name, room: r.room, output: { item: r.output.item, qty }, used, start: now, end: now + r.time * n * 60000 });
    commit();
    showToast(`⏱ Started ${r.name} ×${qty} – ready in ${fmtMinutes(r.time * n)}`, snap, "craft");
  } else {
    setCountRaw(r.output.item, have(r.output.item) + qty);
    commit();
    showToast(`🛠 Crafted ${itemName(r.output.item)} ×${qty}`, snap, "craft");
  }
}
function downloadBackup() {
  try {
    const blob = new Blob([backupText()], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "gzw-companion-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    showToast("Backup downloaded. If nothing happened, use Copy backup text.");
  } catch (e) { ACTIONS["copy-backup"](); }
}
function restore(text) {
  let s;
  try { s = parseBackup(text); } catch (e) { showToast("⚠️ Couldn't read that backup: " + e.message); return; }
  confirmBox("Restore backup?", "This replaces everything currently saved in the app.", "Restore", () => {
    const snap = snapshot(); state = s; commit(); showToast("Backup restored", snap, "restore");
  }, true);
}

const ACTIONS = {
  undo() { if (!toast.snap) return; state = normalize(JSON.parse(toast.snap)); hideToast(); commit(); showToast("Undone"); },
  backdrop(el, e) { if (e.target === el) closeModal(); },
  "modal-close": closeModal,
  "modal-ok"() { const fn = modalOk; closeModal(); if (fn) fn(); },
  // inventory
  "toggle-item"(el) { ui.openItem = ui.openItem === el.dataset.id ? null : el.dataset.id; render(); },
  fav(el) {
    const id = el.dataset.id, snap = snapshot(), on = state.favorites.includes(id);
    state.favorites = on ? state.favorites.filter((x) => x !== id) : [...state.favorites, id];
    commit(); showToast(on ? `Removed ${itemName(id)} from favorites` : `★ ${itemName(id)} moved to Favorites`, snap, "fav");
  },
  "inv-cat"(el) { state.prefs.category = el.dataset.v; commit(); },
  "inv-menu"() { ui.invMenu = !ui.invMenu; render(); },
  "add-item"() { openItemForm(null); },
  "edit-item"(el) { openItemForm(el.dataset.id); },
  "delete-item"(el) {
    const id = el.dataset.id;
    confirmBox("Delete material?", `Delete <b>${esc(itemName(id))}</b>? Recipes that use it will show it as a deleted item.`, "Delete", () => {
      const snap = snapshot();
      state.customItems = state.customItems.filter((i) => i.id !== id);
      state.favorites = state.favorites.filter((x) => x !== id);
      state.order = state.order.filter((x) => x !== id);

  },
  export: downloadBackup,
  import() { const f = document.getElementById("import-file"); f.value = ""; f.click(); },
  "copy-backup"() {
    openModal(`<div class="modal-body"><h3>Backup text</h3><p class="muted-s">Copy all of this and keep it somewhere safe (notes app, email to yourself).</p>
      <textarea id="backup-text" rows="8" readonly>${esc(backupText())}</textarea>
      <div class="modal-buttons"><button class="btn primary" data-act="copy-now">📋 Copy</button><button class="btn" data-act="modal-close">Close</button></div></div>`);
  },
  "copy-now"() {

    const done = () => showToast("Copied to clipboard");

    else { document.execCommand("copy"); done(); }
  },
  "paste-backup"() {
    openModal(`<form data-form="import" class="modal-body"><h3>Paste backup text</h3><textarea name="text" rows="8" required placeholder="Paste here..."></textarea>
      <div class="modal-buttons"><button type="submit" class="btn primary">Restore</button><button type="button" class="btn" data-act="modal-close">Cancel</button></div></form>`);
  },
  reset() {
    confirmBox("Reset for wipe?", "Sets every item count to 0, every station to level 0, clears active crafts and recipe/task ticks. Favorites, order, custom items and custom recipes are kept.", "Reset", () => {
      const snap = snapshot();
      state.counts = {}; state.stationLevels = {}; state.jobs = []; state.recipeFlags = {};
      commit(); showToast("Reset done", snap, "reset");
    }, true);
  },
  // rooms
  "hide-banner"() { state.prefs.hideBanner = true; commit(); },
  "room-filter"(el) { state.prefs.roomFilter = el.dataset.v; commit(); },
  "pin-station"(el) {
    const id = el.dataset.id, on = state.pins.includes(id);
    state.pins = on ? state.pins.filter((x) => x !== id) : [...state.pins, id];
    commit(); showToast(on ? "Unpinned" : "📌 Pinned – shows in Inventory → Need: Pinned only");
  },
  "shopping-list"() { state.prefs.needMode = "pinned"; state.prefs.neededOnly = true; state.prefs.category = "all"; ui.invQuery = ""; saveState(); location.hash = "#/hideout/inventory"; },
  build(el) {
    const st = STATION_BY_ID[el.dataset.id]; if (!st) return;
    const i = stationInfo(st); if (i.status === "maxed" || i.missing.length) return;
    const warns = [];
    if (i.unmet.length) warns.push("Requirement not met: " + i.unmet.map((u) => `${esc(capName(u.id))} ≥ ${u.min} (you: ${u.have})`).join(", "));
    if (i.powerOver) warns.push(`Power would be ${i.after} / ${i.made} kW.`);
    if (warns.length) confirmBox("Build anyway?", warns.join("<br>") + "<br><br>The data is unconfirmed, so you can still build.", "Build anyway", () => doBuild(st));
    else doBuild(st);
  },
  "set-level"(el) {
    const st = STATION_BY_ID[el.dataset.id], sel = document.getElementById("set-level"); if (!st || !sel) return;
    const n = clamp(int(sel.value), 0, st.levels.length), snap = snapshot();

  "hide-craft-note"() { state.prefs.hideCraftNote = true; commit(); },
  "craft-room"(el) { state.prefs.craftRoom = el.dataset.v; commit(); },
  "craft-status"(el) { state.prefs.craftStatus = el.dataset.v; commit(); },
  "craft-n"(el) { const id = el.dataset.id; ui.craftN[id] = clamp((ui.craftN[id] || 1) + int(el.dataset.d), 1, 99); render(); },
  "pin-recipe"(el) {

    commit(); showToast(on ? "Unpinned" : "📌 Ingredients added to your Inventory “need” numbers");
  },
  "pin-qty"(el) {
    const id = el.dataset.id, n = clamp((state.recipePins[id] || 1) + int(el.dataset.d), 0, 99);
    if (n) state.recipePins[id] = n; else delete state.recipePins[id];
    commit();
  },
  craft(el) {
    const r = getRecipe(el.dataset.id); if (!r) return;
    const n = ui.craftN[r.id] || 1, i = recipeInfo(r, n);
    if (i.incomplete || !i.stationOk || !i.capOk || i.missing.length) return;
    const warns = [];
    if (!i.foundOk) warns.push("You haven't ticked “recipe found”.");
    if (!i.taskOk) warns.push("You haven't ticked the task: " + esc(r.task));
    if (i.powerOver) warns.push(`Needs ${r.power} kW, you have ${i.spare} kW spare.`);
    if (warns.length) confirmBox("Craft anyway?", warns.join("<br>"), "Craft anyway", () => doCraft(r, n));
    else doCraft(r, n);
  },
  collect(el) {
    const j = state.jobs.find((x) => x.id === el.dataset.id); if (!j || j.end > Date.now()) return;

    setCountRaw(j.output.item, have(j.output.item) + j.output.qty);
    state.jobs = state.jobs.filter((x) => x.id !== j.id);
    commit(); showToast(`Collected ${itemName(j.output.item)} ×${j.output.qty}`, snap, "collect");
  },
  "cancel-job"(el) {
    const j = state.jobs.find((x) => x.id === el.dataset.id); if (!j) return;
    confirmBox("Cancel craft?", `Cancel ${esc(j.name)}? The ingredients go back to your Inventory.`, "Cancel craft", () => {
      const snap = snapshot();
      for (const x of j.used) setCountRaw(x.item, have(x.item) + x.qty);

      const snap = snapshot(); delete state.recipeOverrides[id]; commit(); showToast("Recipe reset to default", snap, "rreset");
    }, true);
  },
  "delete-recipe"(el) {
    const id = el.dataset.id;

      const snap = snapshot();

      state.jobs = state.jobs.filter((j) => j.recipeId !== id || j.end <= Date.now());
      saveState(); location.hash = "#/hideout/crafting"; render(); showToast("Recipe deleted", snap, "rdel");
    }, true);

  "ing-add"() { document.getElementById("ing-rows").insertAdjacentHTML("beforeend", ingRowHtml(null)); },
  "ing-remove"(el) { el.closest(".ing-row").remove(); },
};

// =============================================================
// EVENT WIRING
// =============================================================
const app = document.getElementById("app");
let suppressClick = false;
document.addEventListener("click", (e) => {
  if (suppressClick) { suppressClick = false; e.preventDefault(); return; }
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (el.tagName === "A" || el.tagName === "BUTTON") e.preventDefault();
  fn(el, e);
});

// + / − with hold-to-repeat (hold = steps of 5, then 10)
let hold = null;
function stopHold() { if (hold) { clearTimeout(hold.t); clearInterval(hold.i); hold = null; } }
document.addEventListener("pointerdown", (e) => {
  const b = e.target.closest(".step"); if (!b) return;
  e.preventDefault();
  const id = b.dataset.id, dir = int(b.dataset.step), item = getItem(id), step = (item && item.step) || 1;
  changeCount(id, dir * step);
  let ticks = 0;
  hold = { t: setTimeout(() => { hold.i = setInterval(() => { ticks++; changeCount(id, dir * step * (ticks > 10 ? 10 : 5)); }, 180); }, 500) };
});
["pointerup", "pointercancel", "pointerleave"].forEach((ev) => document.addEventListener(ev, stopHold));
document.addEventListener("click", (e) => { if (e.target.closest(".step")) e.preventDefault(); }, true);

// Typed counts, search boxes
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.input === "inv-search") { ui.invQuery = t.value; document.getElementById("inv-list").innerHTML = renderInvList(); }
  if (t.dataset.input === "craft-search") { ui.craftQuery = t.value; document.getElementById("craft-list").innerHTML = renderCraftList(); }
});
document.addEventListener("focusin", (e) => { if (e.target.matches(".count")) setTimeout(() => e.target.select(), 0); });
document.addEventListener("keydown", (e) => {
  if (e.target.matches(".count") && e.key === "Enter") e.target.blur();
  if (e.key === "Escape") closeModal();
});
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.count) {
    const id = t.dataset.count, val = Math.max(0, int(String(t.value).replace(/[^0-9]/g, "")));
    if (val !== have(id)) changeCount(id, val - have(id)); else t.value = have(id);
    return;
  }
  const c = t.dataset.change;
  if (c === "inv-sort") { state.prefs.sort = t.value; commit(); }
  else if (c === "inv-need") { state.prefs.needMode = t.value; commit(); }
  else if (c === "inv-needed") { state.prefs.neededOnly = t.checked; commit(); }
  else if (c === "flag") {
    const f = state.recipeFlags[t.dataset.id] || { found: false, task: false };
    f[t.dataset.flag] = t.checked; state.recipeFlags[t.dataset.id] = f; commit();
  } else if (c === "output-select") {
    document.getElementById("new-output").hidden = t.value !== "__new";
  }
});
document.getElementById("import-file").addEventListener("change", (e) => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader(); rd.onload = () => restore(String(rd.result)); rd.readAsText(f);
});

// Forms
function formError(msg) { const el = document.getElementById("form-error"); if (el) el.textContent = msg; }
function newItemId(name) {
  let base = "custom-" + (slug(name) || "item"), id = base, n = 2;
  while (getItem(id)) id = base + "-" + n++;
  return id;
}
function nameTaken(name, exceptId) {
  const s = slug(name);
  return allItems().some((i) => i.id !== exceptId && slug(i.name) === s);
}
document.addEventListener("submit", (e) => {
  const f = e.target, kind = f.dataset.form; if (!kind) return;
  e.preventDefault();
  const fd = new FormData(f), g = (k) => String(fd.get(k) || "").trim();
  if (kind === "import") { closeModal(); restore(g("text")); return; }
  if (kind === "item") {
    const name = g("name"), editId = f.dataset.id;
    if (!name) return formError("Please enter a name.");
    if (nameTaken(name, editId)) return formError("An item with this name already exists.");
    const snap = snapshot();
    const data = cleanItem({ id: editId || newItemId(name), name, category: g("category"), image: g("image"), info: g("info"), step: g("step") });
    if (editId) state.customItems = state.customItems.map((i) => (i.id === editId ? data : i));
    else { state.customItems.push(data); state.order.push(data.id); }
    closeModal(); commit(); showToast(editId ? "Material updated" : `Added ${name}`, snap, "item");
    return;
  }
  if (kind === "recipe") {
    const name = g("name"); if (!name) return formError("Please enter a recipe name.");
    const snap = snapshot();
    let outItem = g("output");
    if (outItem === "__new") {
      const on = g("newOutput") || name;
      const existing = allItems().find((i) => slug(i.name) === slug(on));
      if (existing) outItem = existing.id;
      else {
        const it = cleanItem({ id: newItemId(on), name: on, category: "crafted", info: "Made by: " + name });
        state.customItems.push(it); state.order.push(it.id); outItem = it.id;
      }
    }
    const ings = [], seen = new Set();
    f.querySelectorAll(".ing-row").forEach((row) => {
      const item = row.querySelector(".ing-item").value; if (!item) return;
      const qty = Math.max(1, int(row.querySelector(".ing-qty").value) || 1), unsure = row.querySelector(".ing-unsure").checked;
      if (seen.has(item)) { ings.find((x) => x.item === item).qty += qty; return; }
      seen.add(item); ings.push({ item, qty, unsure });
    });
    if (ings.some((x) => x.item === outItem)) return formError("A recipe can't use the item it makes.");
    const stId = g("station"), capId = g("cap"), kindR = f.dataset.kind;
    const id = kindR === "new" ? "custom-recipe-" + uid() : f.dataset.id;
    const base = kindR === "builtin" ? BUILT_IN_RECIPE_BY_ID[id] : null;
    const rec = cleanRecipe({
      id, name, room: g("room"), output: { item: outItem, qty: g("outQty") }, ingredients: ings,
      station: stId ? { id: stId, level: g("stationLevel") } : null, stationGuess: fd.get("stationGuess") === "on",
      cap: capId ? { id: capId, min: g("capMin") } : null, needsRecipe: fd.get("needsRecipe") === "on", task: g("task"),
      power: g("power"), time: int(g("hours")) * 60 + clamp(int(g("minutes")), 0, 59), notes: g("notes"), source: base ? base.source : "Added by you",
    });
    if (kindR === "builtin") state.recipeOverrides[id] = rec;
    else if (kindR === "custom") state.customRecipes = state.customRecipes.map((r) => (r.id === id ? rec : r));
    else state.customRecipes.push(rec);
    closeModal(); saveState();
    if (location.hash !== "#/hideout/recipe/" + encodeURIComponent(id)) location.hash = "#/hideout/recipe/" + encodeURIComponent(id);
    render(); showToast(kindR === "new" ? `Added recipe ${name}` : "Recipe saved", snap, "recipe");
  }
});

// Drag to reorder (by the ≡ handle, works with touch and mouse)
let drag = null;
document.addEventListener("pointerdown", (e) => {
  const h = e.target.closest("[data-handle]"); if (!h) return;
  e.preventDefault();
  const row = h.closest(".row"), list = row.parentElement;
  drag = { row, list, y: e.clientY, moved: false };
  row.classList.add("dragging"); document.body.classList.add("is-dragging");
  try { h.setPointerCapture(e.pointerId); } catch (_) {}
});
document.addEventListener("pointermove", (e) => {
  if (!drag) return;
  e.preventDefault();
  const rows = [...drag.list.children].filter((r) => r !== drag.row);
  let before = null;
  for (const r of rows) { const b = r.getBoundingClientRect(); if (e.clientY < b.top + b.height / 2) { before = r; break; } }
  if (before !== drag.row.nextElementSibling) { drag.list.insertBefore(drag.row, before); drag.moved = true; }
  if (e.clientY < 60) window.scrollBy(0, -12); else if (e.clientY > window.innerHeight - 60) window.scrollBy(0, 12);
}, { passive: false });
function endDrag() {
  if (!drag) return;
  const { row, list, moved } = drag; drag = null;
  row.classList.remove("dragging"); document.body.classList.remove("is-dragging");
  if (moved) {
    const snap = snapshot();
    applyOrder([...list.children].map((r) => r.dataset.id));
    commit(); showToast("Order saved", snap, "order");
  }
}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", endDrag);

// Timers: update countdowns every second, refresh when a craft finishes
let lastReady = readyJobs();
setInterval(() => {
  const now = Date.now();
  document.querySelectorAll("[data-end]").forEach((el) => (el.textContent = fmtDur(int(el.dataset.end) - now)));
  document.querySelectorAll("[data-collect]").forEach((el) => (el.disabled = int(el.dataset.collect) > now));
  const r = readyJobs();
  if (r !== lastReady) { lastReady = r; if (r && !document.querySelector("#modal-root .modal")) { render(); showToast("⏱ A craft is ready to collect"); } }
}, 1000);

window.addEventListener("hashchange", () => { ui.openItem = null; stopHold(); render(); window.scrollTo(0, 0); });
window.addEventListener("storage", (e) => { if (e.key === STORAGE_KEY) { state = loadState(); render(); } });
render();
</script>

const disStationOk = (r) => !r.station || lvl(r.station.id) >= r.station.level;

const disEnd = (q) => (q.start != null ? q.start + q.dur : null);

// Starts waiting items in queue order whenever a slot is free (also catches up after being offline)
function disAdvance(now = Date.now(), queue = state.disQueue) {
  const slots = state.prefs.disSlots || 1;
  const ends = queue.filter((q) => q.start != null).map((q) => q.start + q.dur);
  let prev = -Infinity, changed = false;
  for (const q of queue) {
    if (q.start != null) continue;
    const t0 = Math.max(q.added, prev);
    const cands = [t0, ...ends.filter((e) => e > t0)].sort((a, b) => a - b);
    let t = null;
    for (const c of cands) if (ends.filter((e) => e > c).length < slots) { t = c; break; }
    if (t == null || t > now) break;
    q.start = t; ends.push(t + q.dur); prev = t; changed = true;
  }
  return changed;
}
// Waiting items may not start earlier than "now" after a slot is freed by hand
function bumpWaiting(now = Date.now()) { for (const q of state.disQueue) if (q.start == null) q.added = Math.max(q.added, now); }
function disEstimate() {
  const copy = state.disQueue.map((q) => ({ ...q }));
  disAdvance(Infinity, copy);
  return Object.fromEntries(copy.map((q) => [q.id, q.start]));
}
function disAdd(r, n) {
  n = Math.max(1, int(n));
  if (!r || !disStationOk(r) || have(r.input) < n || !r.outputs.length) return;
  const snap = snapshot(), now = Date.now();
  setCountRaw(r.input, have(r.input) - n);
  for (let k = 0; k < n; k++) {
    state.disQueue.push({ id: uid() + k, recipeId: r.id, input: r.input, outputs: r.outputs.map((o) => ({ item: o.item, qty: o.qty })), dur: r.time * 60000, added: now, start: null });
  }
  disAdvance(now); ui.disN[r.id] = 1; commit();
  showToast(`🔩 Queued ${itemName(r.input)} ×${n}`, snap, "disadd");
}
function disCollect(ids) {
  const now = Date.now(), done = state.disQueue.filter((q) => ids.includes(q.id) && disEnd(q) != null && disEnd(q) <= now);
  if (!done.length) return;
  const snap = snapshot(), got = {};
  for (const q of done) for (const o of q.outputs) { setCountRaw(o.item, have(o.item) + o.qty); got[o.item] = (got[o.item] || 0) + o.qty; }
  const doneIds = new Set(done.map((q) => q.id));
  state.disQueue = state.disQueue.filter((q) => !doneIds.has(q.id));
  commit();
  showToast("Collected: " + Object.entries(got).map(([id, n]) => `${itemName(id)} ×${n}`).join(", "), snap, "discollect");
}

  "dis-hide-note"() { state.prefs.hideDisNote = true; commit(); },

  "dis-add"(el) { const r = disGet(el.dataset.id); if (r) disAdd(r, el.dataset.n ? int(el.dataset.n) : ui.disN[r.id] || 1); },

.art-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.art-prompt { margin-top: 8px; font-size: 13px; }
.art-prompt summary { cursor: pointer; color: var(--accent); }
.art-url { min-width: 0; font-size: 14px; padding: 8px 10px; }
</style>`);

render();
})();
</script>
<script>
// =============================================================
// LAUNCH UPDATE (added in 0.1.6)
// Built-in art for everyone, feedback button, What's new, About
// =============================================================
(() => {
"use strict";
const VERSION = "0.1.6";
const SITE = "https://readyplayer99.github.io/gzw-companion/";
const REPO = "https://github.com/Readyplayer99/gzw-companion";
// Paste your Google Form link between the quotes to use it for the 💬 button:
const FEEDBACK_URL = "";
const SEEN_KEY = "gzw-companion-seen";
const DISCLAIMER = "Unofficial community-made tool. Not affiliated with or endorsed by MADFINGER Games.";
const CHANGES = [
  ["0.1.6", ["Built-in artwork that everyone sees", "💬 Feedback button (top right)", "About and What's new screens"]],
  ["0.1.5", ["🎨 Art & look: add your own pictures"]],
  ["0.1.4", ["🔩 Disassembly tab with a queue and timers that run while you're offline"]],
  ["0.1.3", ["🛠 Crafting tab: recipes, locks, craft timers and your own recipes"]],
  ["0.1.2", ["🏗 Rooms tab: stations, building, capabilities and power"]],
  ["0.1.1", ["📦 Hideout inventory with favorites, search and backups"]],
];
const ABOUT_HTML = `<p class="modal-msg">A free Gray Zone Warfare hideout tracker. Track your materials, station upgrades, crafting and disassembly timers, and pin goals to get a shopping list.</p>
  <p class="modal-msg"><b>Coming soon:</b> player stats, weapon builder and loot prices.</p>
  <p class="modal-msg"><b>Why I made it:</b> I wanted to spend less time figuring out what to collect and more time actually playing.</p>
  <p class="muted-s">No account needed. Your data stays on your device – use the backup buttons to keep it safe. Game data for 0.5 is community-sourced and unconfirmed, so please report anything that's wrong.</p>
  <p class="muted-s">${esc(DISCLAIMER)} AI was used to help build this app and create its artwork.</p>`;

const ART = window.GZW_ART || null;
let defaults = {};

// ---------- Built-in art (art.json or picture files in the GitHub repo) ----------
function probe(url) {
  return new Promise((res) => {
    const i = new Image(); let done = false;
    const fin = (v) => { if (!done) { done = true; res(v); } };
    i.onload = () => fin(true); i.onerror = () => fin(false);
    i.src = url; setTimeout(() => fin(false), 15000);
  });
}
async function loadDefaults() {
  if (!ART) return;
  let found = {};
  try {
    const r = await fetch(SITE + "art.json", { cache: "no-cache" });
    if (r.ok) found = ART.cleanArt(await r.json());
  } catch (e) {}
  if (!Object.keys(found).length) {
    await Promise.all(ART.ART_SLOTS.map(async (s) => {
      for (const ext of s.id === "icon" ? ["png", "jpg"] : ["jpg", "png"]) {
        const u = SITE + s.id + "." + ext;
        if (await probe(u)) { found[s.id] = u; return; }
      }
    }));
  }
  defaults = found;
  if (Object.keys(found).length) render();
}

// ---------- Helpers ----------
function copy(t, msg) {
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove(); showToast(ok ? msg : "Couldn't copy on this browser.");
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => showToast(msg), fallback);
  else fallback();
}
const changesHtml = (list) => list.map(([v, items]) => `<div class="wn"><b>v${v}</b><ul>${items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul></div>`).join("");
function newerThan(seen) { const i = CHANGES.findIndex((c) => c[0] === seen); return i < 0 ? CHANGES.slice(0, 1) : CHANGES.slice(0, i); }
function openAbout(welcome) {
  openModal(`<div class="modal-body"><h3>${welcome ? "👋 Welcome to GZW Companion" : "ℹ️ About GZW Companion"}</h3>${ABOUT_HTML}
    <div class="modal-buttons"><button class="btn primary" data-act="modal-close">${welcome ? "Let's go" : "Close"}</button><button class="btn" data-act="feedback">💬 Feedback</button></div></div>`);
}
function openWhatsNew(list) {
  openModal(`<div class="modal-body"><h3>📰 What's new</h3>${changesHtml(list)}
    <div class="modal-buttons"><button class="btn primary" data-act="modal-close">Got it</button><button class="btn" data-act="wn-all">Full history</button></div></div>`);
}
function openFeedback() {
  if (FEEDBACK_URL) { window.open(FEEDBACK_URL, "_blank", "noopener"); return; }
  openModal(`<div class="modal-body"><h3>💬 Feedback & bug reports</h3>
    <p class="modal-msg">Found a bug or wrong game data, or have an idea? I'd love to hear it.</p>
    <a class="btn primary" href="${REPO}/issues/new" target="_blank" rel="noopener">Report on GitHub</a>
    <p class="muted-s">GitHub needs a free account. You can also reply on the Reddit or Discord post where you found the app.</p>
    <button class="btn" data-act="fb-copy">📋 Copy app info (helps with bug reports)</button>
    <div class="modal-buttons"><button class="btn" data-act="modal-close">Close</button></div></div>`);
}
function ownerCard() {
  const own = ART ? Object.keys(ART.art).length : 0;
  return `<details class="card"><summary>🛠 For the app owner: share your pictures with everyone</summary>
    <ol class="owner-steps"><li>Tap <b>Download art.json</b> below. It contains the pictures you uploaded on this device (${own}).</li>
    <li>On GitHub, open your <b>gzw-companion</b> repository → <b>Add file → Upload files</b>.</li>
    <li>Upload <b>art.json</b> (the name must be exactly that) and tap <b>Commit changes</b>.</li>
    <li>Wait 1–2 minutes, then reload the app. Everyone now sees your pictures.</li></ol>
    <button class="btn primary" data-act="owner-art" ${own ? "" : "disabled"}>⬇️ Download art.json</button></details>`;
}

// ---------- Hook into the main app ----------
const prevRender = render;
render = function () {
  const a = ART ? ART.art : null, added = [];
  if (a) for (const k of Object.keys(defaults)) if (!a[k]) { a[k] = defaults[k]; added.push(k); }
  try { prevRender(); } finally { if (a) for (const k of added) delete a[k]; }
  const [main] = route();
  const v = document.querySelector("#app .version");
  if (v) {
    v.textContent = "v" + VERSION;
    v.insertAdjacentHTML("beforebegin", `<button class="fb-btn" data-act="feedback" aria-label="Send feedback">💬</button>`);
  }
  if (!main) {
    const home = document.querySelector("#app .home");
    if (home) home.insertAdjacentHTML("beforeend", `<div class="home-links"><button class="btn" data-act="about">ℹ️ About</button><button class="btn" data-act="whats-new">📰 What's new</button><button class="btn" data-act="feedback">💬 Feedback</button></div>
      <p class="footnote disclaimer">${esc(DISCLAIMER)}<br>Artwork is AI-generated.</p>`);
  } else if (main === "art") {
    for (const k of added) {
      const b = document.querySelector(`[data-act="art-remove"][data-slot="${k}"]`);
      if (b) b.outerHTML = `<span class="tag builtin">Built-in picture</span>`;
      const inp = document.getElementById("art-url-" + k); if (inp) inp.value = "";
    }
    const page = document.querySelector("#app main.page");
    if (page) {
      if (Object.keys(defaults).length) page.insertAdjacentHTML("afterbegin", `<div class="hint">🖼 This app comes with built-in pictures. Anything you upload replaces them on your device only.</div>`);
      page.insertAdjacentHTML("beforeend", ownerCard());
    }
  }
};

Object.assign(ACTIONS, {
  feedback() { openFeedback(); },
  about() { openAbout(false); },
  "whats-new"() { openWhatsNew(CHANGES.slice(0, 1)); },
  "wn-all"() { openWhatsNew(CHANGES); },
  "fb-copy"() {
    copy(`GZW Companion v${VERSION} | ${navigator.userAgent} | screen ${window.innerWidth}x${window.innerHeight} | page ${location.hash || "#/"}`, "App info copied – paste it into your report");
  },
  "owner-art"() {
    if (!ART) return;
    try {
      const text = JSON.stringify({ app: "gzw-companion-art", v: 1, slots: ART.art });
      const blob = new Blob([text], { type: "application/json" });
      const el = document.createElement("a");
      el.href = URL.createObjectURL(blob); el.download = "art.json";
      document.body.appendChild(el); el.click(); el.remove();
      setTimeout(() => URL.revokeObjectURL(el.href), 2000);
      showToast(`art.json downloaded (${(text.length / 1048576).toFixed(1)} MB)`);
    } catch (e) { showToast("⚠️ Couldn't download in this browser view."); }
  },
});

document.head.insertAdjacentHTML("beforeend", `<style>
.fb-btn { background: none; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; padding: 4px 8px; }
.home-links { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.footnote.disclaimer { margin-top: 4px; line-height: 1.5; }
.wn { border-top: 1px solid var(--border); padding-top: 8px; font-size: 14px; }
.wn ul { margin: 4px 0 0; padding-left: 20px; }
.owner-steps { font-size: 14px; padding-left: 20px; line-height: 1.5; }
.tag.builtin { color: var(--accent); padding: 4px 8px; }
</style>`);

// ---------- Welcome / What's new popup ----------
setTimeout(() => {
  let seen = null, hasData = false;
  try { seen = localStorage.getItem(SEEN_KEY); hasData = !!localStorage.getItem(STORAGE_KEY); } catch (e) {}
  if (seen === VERSION || document.querySelector("#modal-root .modal")) return;
  if (!seen && !hasData) openAbout(true);
  else openWhatsNew(seen ? newerThan(seen) : CHANGES.slice(0, 1));
  try { localStorage.setItem(SEEN_KEY, VERSION); } catch (e) {}
}, 700);

render();
loadDefaults();
})();
</script>
